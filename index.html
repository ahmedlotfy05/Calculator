<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link rel = "stylesheet" href = "style.css">
    <script src = "console.js" defer></script>

</head>
<body>

    <main>

        <h1>CalculatorMaxxing</h1>
        <div id = "container">

            <button id = "1", class = "numbers">1</button>
            <button id = "2", class = "numbers">2</button>
            <button id = "3", class = "numbers">3</button><br>
            <button id = "4", class = "numbers">4</button>
            <button id = "5", class = "numbers">5</button>
            <button id = "6", class = "numbers">6</button><br>
            <button id = "7", class = "numbers">7</button>
            <button id = "8", class = "numbers">8</button>
            <button id = "9", class = "numbers">9</button>
            <button id = "0", class = "numbers">0</button><br>
            <button id = "+", class = "operators">+</button>
            <button id = "-", class = "operators">-</button>
            <button id = "*", class = "operators">*</button>
            <button id = "/", class = "operators">/</button>
            <button id = "=", class = "equal">=</button><br>
            <button id = "←", class = "clear">←</button>
            <div id = "display"></div>

        </div>

    </main>

</body>
</html>
